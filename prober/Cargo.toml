[package]
name = "prober"
version = "0.1.0"
edition = "2024"

[dependencies]
configuration = { path = "../configuration" }
exporter = { path = "../exporter" }
tokio = { version = "1.45.1", features = ["full"] }
openssl = "0.10.73"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3.31"
reqwest = { version = "0.12.20", features = ["json", "native-tls"] }
native-tls = "0.2.14"
tokio-native-tls = "0.3.1"
chrono = "0.4.41"
url = "2.5.4"
