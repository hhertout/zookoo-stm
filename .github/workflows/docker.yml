name: 🐳 Deploy ZookooZookoo - DockerHub

on:
  push:
    branches: ["develop", "cd/develop"]

jobs:
  docker_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: neryolo
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push API image - latest
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/prod.dockerfile
        push: true
        tags: neryolo/zookoozookoo:latest

    - name: Get latest git tag
      id: get_tag
      run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

    - name: Build and push API image - with version
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/prod.dockerfile
        push: true
        tags: neryolo/zookoozookoo:${{ steps.get_tag.outputs.tag }}