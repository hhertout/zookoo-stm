name: 🐳 Deploy Nightly - DockerHub

on:
  push:
    branches: ["staging"]

jobs:
  docker_repository_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: neryolo
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push API image - nightly | Debian
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./.docker/deb.dockerfile
        push: true
        tags: neryolo/zookoo:nightly

    - name: Build and push API image - nightly | Ubuntu
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./.docker/ubuntu.dockerfile
        push: true
        tags: neryolo/zookoo:nightly-ubuntu

    - name: Build and push API image - nightly | Alpine
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./.docker/alpine.dockerfile
        push: true
        tags: neryolo/zookoo:nightly-alpine