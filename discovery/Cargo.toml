[package]
name = "discovery"
version = "0.1.0"
edition = "2024"

[dependencies]
configuration = {path = "../configuration" }
tokio = { version = "1.45", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.27"
reqwest = { version = "0.13", features = ["json"] }
async-trait = "0.1"
tracing = { version = "0.1", features = ["attributes"] }

[dev-dependencies]
tempfile = "3.14"
httpmock = "0.8.2"
