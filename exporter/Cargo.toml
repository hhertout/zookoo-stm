[package]
name = "exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
opentelemetry = { version = "0.31.0" }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
sqlx = "0.8.6"
opentelemetry-otlp = { version = "0.31.0", features = [
    "grpc-tonic",
    "tls-roots",
] }
hyper = "1.6.0"
tokio = "1.45.1"
log = "0.4.27"
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
prost = "0.14.1"
prost-types = "0.14.1"
snap = "1.1.1"
