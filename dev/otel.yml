receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true

processors:
  batch:
  tail_sampling:
    decision_wait: 30s
    policies: [
        {
          name: sample-erroring-traces,
          type: status_code,
          status_code: { status_codes: [ERROR] },
        },
        {
          name: sample-long-traces,
          type: latency,
          latency: { threshold_ms: 200 },
        },
      ]

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheusremotewrite]
    logs:
      receivers: [otlp]
      exporters: [debug]