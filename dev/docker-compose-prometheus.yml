version: '3.8'

services:
  # Grafana Alloy for Prometheus Remote Write + OTLP
  alloy:
    image: grafana/alloy:latest
    container_name: zookoo-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/alloy-prometheus-config.alloy:/etc/alloy/config.alloy
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9999:9999"   # Prometheus remote_write receiver
      - "12345:12345" # Alloy UI
    networks:
      - zookoo-prom

  # Prometheus for remote_write
  prometheus:
    image: prom/prometheus:latest
    container_name: zookoo-prometheus-remote-write
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./prometheus/prometheus-remote-write.yml:/etc/prometheus/prometheus.yml
      - prometheus-remote-write-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - zookoo-prom

  grafana:
    image: grafana/grafana:latest
    container_name: zookoo-grafana-prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_DASHBOARDS_JSON_PATH=/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - zookoo-prom

networks:
  zookoo-prom:
    driver: bridge

volumes:
  prometheus-remote-write-data:
