version: '3.8'

services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: zookoo-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
    networks:
      - zookoo-otel

  # Prometheus for OTEL metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: zookoo-prometheus-otel
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-otel-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - zookoo-otel

  grafana:
    image: grafana/grafana:latest
    container_name: zookoo-grafana-otel
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_DASHBOARDS_JSON_PATH=/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - zookoo-otel

  zookoo:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: zookoo-timescale
    depends_on:
      - timescaledb
    volumes:
      - ./conf/zookoo-timescale-config.hcl:/config/config.hcl:ro
    command: ["zookoo", "--config", "/config/config.hcl"]
    networks:
      - zookoo-otel

networks:
  zookoo-otel:
    driver: bridge

volumes:
  prometheus-otel-data:
